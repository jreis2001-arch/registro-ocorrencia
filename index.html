        <div class="q-sub">O cadastro para <strong>${escapeHtml(state.store.name)}</strong> foi enviado e está aguardando aprovação do CCO. Assim que for liberado, você já poderá usar o app normalmente.</div>
      </div>
      <button class="btn btn-primary" id="btnVerificarAprovacao">Verificar novamente</button>
      <button class="btn-text" id="btnSairAguardando">Sair</button>
    </div>
  `);
  document.getElementById("btnVerificarAprovacao").onclick = async () => { await loadStoreAndGo(); };
  document.getElementById("btnSairAguardando").onclick = async () => {
    await sb.auth.signOut();
    state.session = null;
    state.screen = "login";
    render();
  };
}

// Staff-only: approve or reject a store that self-registered. Rejecting
// frees the store back to "unclaimed" so it can be registered again.
function screenAprovacoes() {
  mount(`
    <div class="topbar">
      <div class="topbar-row">
        <button class="iconbtn" id="btnBack">${ICONS.back}</button>
        <div class="topbar-title">Cadastros pendentes</div>
      </div>
    </div>
    <div class="content" id="aprovacoesWrap"></div>
    ${bottomNav("home")}
  `);
  document.getElementById("btnBack").onclick = () => { state.screen = "home"; render(); };
  wireNav();
  renderList();

  function renderList() {
    const wrap = document.getElementById("aprovacoesWrap");
    const pending = state.pendingStores || [];
    wrap.innerHTML = pending.length === 0 ? `<div class="empty-note">Nenhum cadastro pendente.</div>` :
      pending.map((s) => `
        <div class="card" style="margin-bottom:10px;">
          <div style="font-weight:600; font-size:14px;">${escapeHtml(s.name)}</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;">${escapeHtml(s.code)} · ${STORE_TYPE_LABELS[s.type] || s.type}</div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" data-approve="${s.id}" style="flex:1;">Aprovar</button>
            <button class="btn-text" data-reject="${s.id}">Rejeitar</button>
          </div>
        </div>
      `).join("");
    wrap.querySelectorAll("[data-approve]").forEach((btn) => {
      btn.onclick = async () => {
        btn.disabled = true;
        const { error } = await sb.from("stores").update({ approved: true }).eq("id", btn.dataset.approve);
        if (error) { showToast("Erro ao aprovar: " + error.message); btn.disabled = false; return; }
        showToast("Loja aprovada.");
        state.pendingStores = await fetchPendingStores();
        renderList();
      };
    });
    wrap.querySelectorAll("[data-reject]").forEach((btn) => {
      btn.onclick = async () => {
        btn.disabled = true;
        const { error } = await sb.from("stores").update({ auth_user_id: null, approved: false }).eq("id", btn.dataset.reject);
        if (error) { showToast("Erro ao rejeitar: " + error.message); btn.disabled = false; return; }
        showToast("Cadastro rejeitado — a loja voltou a ficar disponível.");
        state.pendingStores = await fetchPendingStores();
        renderList();
      };
    });
  }
}

// Staff-only: pick a tipologia, then create/edit/reorder/delete up to 10
// guidance steps for it. Two real screens (picker, then editor) rather than
// one screen with the editor appended below a long list — the tipologia
// list runs to dozens of rows, so an in-place append landed off-screen and
// read as "clicking does nothing".
// Reordering swaps step_order via a scratch value (-1) first, since
// (tipologia, step_order) is unique — writing the target order straight to
// both rows in either sequence would collide.
function screenOrientacoes() {
  renderPicker("");

  function renderPicker(filterText) {
    mount(`
      <div class="topbar">
        <div class="topbar-row">
          <button class="iconbtn" id="btnBack">${ICONS.back}</button>
          <div class="topbar-title">Orientações por ocorrência</div>
        </div>
      </div>
      <div class="content">
        <input type="text" id="tipoSearchAdmin" class="field-input" placeholder="Buscar tipo de ocorrência…">
        <div id="tipoListWrapAdmin"></div>
      </div>
      ${bottomNav("home")}
    `);
    document.getElementById("btnBack").onclick = () => { state.screen = "home"; render(); };
    wireNav();

    const searchInput = document.getElementById("tipoSearchAdmin");
    searchInput.value = filterText;
    const listWrap = document.getElementById("tipoListWrapAdmin");
    const f = (filterText || "").toLowerCase();
    const filtered = TIPOLOGIA_INDEX.filter((t) => !f || t.tipologia.toLowerCase().includes(f) || t.categoria.toLowerCase().includes(f));
    const groups = [];
    const byCat = {};
    filtered.forEach((t) => {
      if (!byCat[t.categoria]) { byCat[t.categoria] = []; groups.push(t.categoria); }
      byCat[t.categoria].push(t.tipologia);
    });
    listWrap.innerHTML = groups.length === 0 ? `<div class="empty-note">Nenhum tipo encontrado.</div>` :
      groups.map((cat) => `
        <div class="section-title" style="margin-top:14px;">${escapeHtml(cat)}</div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
          ${byCat[cat].map((tip) => `
            <button class="occ-item" data-tipologia="${escapeHtml(tip)}">
              <div class="occ-text"><div class="occ-proto">${escapeHtml(tip)}</div></div>
              ${ICONS.chevronRight}
            </button>`).join("")}
        </div>
      `).join("");
    listWrap.querySelectorAll("[data-tipologia]").forEach((btn) => {
      btn.onclick = () => loadEditorScreen(btn.dataset.tipologia);
    });
    searchInput.addEventListener("input", (e) => renderPicker(e.target.value));
    // Re-typing after a re-render loses focus/cursor otherwise.
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }

  async function loadEditorScreen(tipologia) {
    const { data: steps, error } = await sb.from("occurrence_guidance").select("*").eq("tipologia", tipologia).order("step_order");
    if (error) { showToast("Erro ao carregar: " + error.message); return; }
    renderEditorScreen(tipologia, steps || []);
  }

  function renderEditorScreen(tipologia, steps) {
    mount(`
      <div class="topbar">
        <div class="topbar-row">
          <button class="iconbtn" id="btnBackToPicker">${ICONS.back}</button>
          <div>
            <div class="topbar-title">${escapeHtml(tipologia)}</div>
            <div class="step-label">Passos de orientação</div>
          </div>
        </div>
      </div>
      <div class="content">
        <div style="display:flex; flex-direction:column; gap:10px;" id="stepsListWrap"></div>
        ${steps.length < 10 ? `
          <div class="field-group" style="margin-top:12px;">
            <div class="field-label">Novo passo</div>
            <textarea id="novoStepText" class="field-input" placeholder="Texto do passo de orientação…" style="min-height:60px;"></textarea>
            <button class="btn btn-primary" id="btnAddStep" style="margin-top:8px;">Adicionar passo</button>
          </div>
        ` : `<div class="empty-note" style="margin-top:12px;">Limite de 10 passos atingido.</div>`}
      </div>
      ${bottomNav("home")}
    `);
    document.getElementById("btnBackToPicker").onclick = () => renderPicker("");
    wireNav();

    const stepsListWrap = document.getElementById("stepsListWrap");
    stepsListWrap.innerHTML = steps.length === 0 ? `<div class="empty-note">Nenhuma orientação cadastrada para este tipo ainda.</div>` :
      steps.map((s, i) => `
        <div class="card">
          <div style="font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;">Passo ${i + 1}</div>
          <textarea class="field-input step-text" data-step-id="${s.id}" style="min-height:60px;">${escapeHtml(s.text)}</textarea>
          <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
            <button class="btn-text" data-up="${s.id}" ${i === 0 ? "disabled" : ""}>↑ Subir</button>
            <button class="btn-text" data-down="${s.id}" ${i === steps.length - 1 ? "disabled" : ""}>↓ Descer</button>
            <button class="btn-text" data-save="${s.id}" style="margin-left:auto;">Salvar</button>
            <button class="btn-text" data-delete="${s.id}" style="color:var(--red);">Excluir</button>
          </div>
        </div>
      `).join("");

    stepsListWrap.querySelectorAll("[data-save]").forEach((btn) => {
      btn.onclick = async () => {
        const text = stepsListWrap.querySelector(`.step-text[data-step-id="${btn.dataset.save}"]`).value.trim();
        if (!text) { showToast("O passo não pode ficar vazio."); return; }
        const { error } = await sb.from("occurrence_guidance").update({ text }).eq("id", btn.dataset.save);
        if (error) { showToast("Erro ao salvar: " + error.message); return; }
        showToast("Passo salvo.");
      };
    });
    stepsListWrap.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.onclick = async () => {
        const { error } = await sb.from("occurrence_guidance").delete().eq("id", btn.dataset.delete);
        if (error) { showToast("Erro ao excluir: " + error.message); return; }
        loadEditorScreen(tipologia);
      };
    });
    stepsListWrap.querySelectorAll("[data-up]").forEach((btn) => {
      btn.onclick = async () => {
        const idx = steps.findIndex((s) => s.id === btn.dataset.up);
        if (idx <= 0) return;
        await swapStepOrder(steps[idx], steps[idx - 1]);
        loadEditorScreen(tipologia);
      };
    });
    stepsListWrap.querySelectorAll("[data-down]").forEach((btn) => {
      btn.onclick = async () => {
        const idx = steps.findIndex((s) => s.id === btn.dataset.down);
        if (idx < 0 || idx >= steps.length - 1) return;
        await swapStepOrder(steps[idx], steps[idx + 1]);
        loadEditorScreen(tipologia);
      };
    });

    const btnAddStep = document.getElementById("btnAddStep");
    if (btnAddStep) {
      btnAddStep.onclick = async () => {
        const textEl = document.getElementById("novoStepText");
        const text = textEl.value.trim();
        if (!text) { showToast("Escreva o texto do passo."); return; }
        if (steps.length >= 10) { showToast("Limite de 10 passos atingido."); return; }
        const nextOrder = steps.length === 0 ? 1 : Math.max(...steps.map((s) => s.step_order)) + 1;
        const { error } = await sb.from("occurrence_guidance").insert({ tipologia, step_order: nextOrder, text });
        if (error) { showToast("Erro ao adicionar: " + error.message); return; }
        loadEditorScreen(tipologia);
      };
    }
  }

  async function swapStepOrder(a, b) {
    const aOrder = a.step_order, bOrder = b.step_order;
    await sb.from("occurrence_guidance").update({ step_order: -1 }).eq("id", a.id);
    await sb.from("occurrence_guidance").update({ step_order: aOrder }).eq("id", b.id);
    await sb.from("occurrence_guidance").update({ step_order: bOrder }).eq("id", a.id);
  }
}

// Shown to the reporter right after picking a tipologia, only when that
// tipologia has guidance steps — otherwise screenTipoOcorrencia skips
// straight to screenDataFato, per "se não houver orientações, seguir
// normalmente".
function screenOrientacao() {
  const d = state.draft;
  mount(`
    <div class="topbar">
      <div class="topbar-row">
        <button class="iconbtn" id="btnBack">${ICONS.back}</button>
        <div>
          <div class="topbar-title">${escapeHtml(d.tipologia)}</div>
          <div class="step-label">Orientações antes de continuar</div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="helper">${ICONS.info}<div class="helper-text">Siga os passos abaixo e marque os que você já fez — o CCO vê o que foi seguido.</div></div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        ${d.guidanceSteps.map((s, i) => `
          <div class="card">
            <div style="display:flex; gap:12px; align-items:flex-start;">
              <div style="flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px;">${i + 1}</div>
              <div style="font-size:13.5px; color:var(--ink); padding-top:3px; white-space:pre-wrap; flex:1;">${escapeHtml(s.text)}</div>
              <label style="flex-shrink:0; padding-top:2px; cursor:pointer;">
                <input type="checkbox" class="guidance-check" data-step-id="${s.id}" ${d.guidanceChecked[s.id] ? "checked" : ""} style="width:21px; height:21px; cursor:pointer; accent-color:var(--primary);">
              </label>
            </div>
          </div>
        `).join("")}
      </div>
      <button class="btn btn-primary" id="btnContinuarOrientacao" style="margin-top:16px;">Já segui as orientações, continuar ${ICONS.arrowRight}</button>
    </div>
  `);
  document.getElementById("btnBack").onclick = () => { state.screen = "tipoOcorrencia"; render(); };
  document.querySelectorAll(".guidance-check").forEach((cb) => {
    cb.addEventListener("change", (e) => { d.guidanceChecked[cb.dataset.stepId] = e.target.checked; });
  });
  document.getElementById("btnContinuarOrientacao").onclick = () => { state.screen = "dataFato"; render(); };
}

// Store-only: request deletion of one of the store's own occurrences. This
// never deletes anything by itself — it just files a request a staff has
// to approve. The protocol + date are checked against a real occurrence
// belonging to this store before the request is even created, so a typo
// (or someone fishing for another store's protocol) fails immediately
// rather than landing an unreviewable request in the staff queue.
function screenSolicitarExclusao() {
  mount(`
    <div class="topbar">
      <div class="topbar-row">
        <button class="iconbtn" id="btnBack">${ICONS.back}</button>
        <div class="topbar-title">Solicitar exclusão de ocorrência</div>
      </div>
    </div>
    <div class="content">
      <div class="helper">${ICONS.info}<div class="helper-text">O pedido fica pendente até o CCO aprovar. A ocorrência só é excluída de fato depois da aprovação.</div></div>
      <div class="field-group">
        <div class="field-label">Código da ocorrência (protocolo) <span class="req">*</span></div>
        <input type="text" id="delProtocol" class="field-input" placeholder="Ex.: RO-2026-123456">
      </div>
      <div class="field-group">
        <div class="field-label">Data da ocorrência <span class="req">*</span></div>
        <input type="date" id="delData" class="field-input" max="${todayLocalDateStr()}">
      </div>
      <div class="field-group">
        <div class="field-label">Loja</div>
        <div class="field-static">${escapeHtml(state.store.name)} · ${escapeHtml(state.store.code)}</div>
      </div>
      <div class="field-group">
        <div class="field-label">Motivo <span class="req">*</span></div>
        <textarea id="delMotivo" class="field-input" placeholder="Explique o motivo da exclusão…" style="min-height:90px;"></textarea>
      </div>
      <button class="btn btn-primary" id="btnEnviarExclusao">Enviar solicitação</button>
    </div>
  `);
  document.getElementById("btnBack").onclick = () => { state.screen = "home"; render(); };
  document.getElementById("btnEnviarExclusao").onclick = async () => {
    const protocol = document.getElementById("delProtocol").value.trim();
    const dataFato = document.getElementById("delData").value;
    const motivo = document.getElementById("delMotivo").value.trim();
    if (!protocol || !dataFato || !motivo) { showToast("Preencha todos os campos."); return; }
    // The `max` attribute stops the native picker, but not manual typing —
    // and an occurrence can never have a future incident_date anyway, so a
    // future date here could never match a real one.
    if (dataFato > todayLocalDateStr()) { showToast("A data da ocorrência não pode ser no futuro."); return; }

    const dataFatoLabel = new Date(dataFato + "T00:00:00").toLocaleDateString("pt-BR");
    const confirmado = confirm(
      "Confira antes de enviar:\n\n" +
      "Protocolo: " + protocol + "\n" +
      "Data: " + dataFatoLabel + "\n" +
      "Loja: " + state.store.name + "\n" +
      "Motivo: " + motivo + "\n\n" +
      "Tem certeza que quer solicitar a exclusão desta ocorrência?"
    );
    if (!confirmado) return;

    const btn = document.getElementById("btnEnviarExclusao");
    btn.disabled = true;
    btn.textContent = "Enviando…";

    const { data: occ, error: occErr } = await sb.from("occurrences").select("id, incident_date").eq("protocol", protocol).eq("store_id", state.store.id).maybeSingle();
    if (occErr || !occ) {
      showToast("Ocorrência não encontrada com esse código para esta loja.");
      btn.disabled = false; btn.textContent = "Enviar solicitação";
      return;
    }
    if (occ.incident_date !== dataFato) {
      showToast("A data informada não corresponde à data registrada nessa ocorrência.");
      btn.disabled = false; btn.textContent = "Enviar solicitação";
      return;
    }

    const { error } = await sb.from("occurrence_deletion_requests").insert({
      occurrence_id: occ.id,
      protocol,
      store_id: state.store.id,
      incident_date: dataFato,
      reason: motivo,
      requested_by: state.session.user.email,
    });
    if (error) { showToast("Erro ao enviar: " + error.message); btn.disabled = false; btn.textContent = "Enviar solicitação"; return; }
    showToast("Solicitação de exclusão enviada. Aguarde a aprovação do CCO.");
    state.screen = "home";
    render();
  };
}

// Staff-only: approve (which deletes the occurrence for real) or reject a
// pending exclusão request. Rejecting just marks the request closed —
// the occurrence is untouched either way until an explicit approval.
function screenExclusoesPendentes() {
  mount(`
    <div class="topbar">
      <div class="topbar-row">
        <button class="iconbtn" id="btnBack">${ICONS.back}</button>
        <div class="topbar-title">Exclusões pendentes</div>
      </div>
    </div>
    <div class="content" id="exclusoesWrap"></div>
    ${bottomNav("home")}
  `);
  document.getElementById("btnBack").onclick = () => { state.screen = "home"; render(); };
  wireNav();
  renderList();

  function renderList() {
    const wrap = document.getElementById("exclusoesWrap");
    const pending = state.pendingDeletions || [];
    wrap.innerHTML = pending.length === 0 ? `<div class="empty-note">Nenhuma solicitação pendente.</div>` :
      pending.map((r) => `
        <div class="card" style="margin-bottom:10px;">
          <div style="font-weight:600; font-size:14px;">${escapeHtml(r.protocol)}</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;">${escapeHtml(r.store ? r.store.name : "—")} · Data do fato: ${r.incident_date ? new Date(r.incident_date + "T00:00:00").toLocaleDateString("pt-BR") : "—"}</div>
          <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;">Solicitado por: ${escapeHtml(r.requested_by || "—")}</div>
          <div style="font-size:13px; color:var(--ink); margin-bottom:10px;"><strong>Motivo:</strong> ${escapeHtml(r.reason)}</div>
          <div class="field-group" style="margin-bottom:10px;">
            <div class="field-label">Mensagem de confirmação para o solicitante</div>
            <textarea class="field-input review-message" data-req-id="${r.id}" placeholder="Ex.: Exclusão aprovada, ocorrência era duplicada." style="min-height:60px;"></textarea>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" data-approve="${r.id}" style="flex:1;">Aprovar e excluir</button>
            <button class="btn-text" data-reject="${r.id}" style="color:var(--red);">Rejeitar</button>
          </div>
        </div>
      `).join("");

    wrap.querySelectorAll("[data-approve]").forEach((btn) => {
      btn.onclick = async () => {
        if (!confirm("Tem certeza? A ocorrência será excluída definitivamente, junto com as evidências anexadas.")) return;
        btn.disabled = true;
        const req = pending.find((r) => r.id === btn.dataset.approve);
        const message = wrap.querySelector(`.review-message[data-req-id="${req.id}"]`).value.trim();
        if (req.occurrence_id) {
          const { error: delErr } = await sb.from("occurrences").delete().eq("id", req.occurrence_id);
          if (delErr) { showToast("Erro ao excluir a ocorrência: " + delErr.message); btn.disabled = false; return; }
        }
        const { error } = await sb.from("occurrence_deletion_requests").update({ status: "aprovada", reviewed_at: new Date().toISOString(), review_message: message || null }).eq("id", req.id);
        if (error) { showToast("Erro ao atualizar a solicitação: " + error.message); btn.disabled = false; return; }
        showToast("Ocorrência excluída.");
        await notifyRequester(req, "aprovada", message);
        state.pendingDeletions = await fetchPendingDeletions();
        state.occurrences = await fetchOccurrences();
        renderList();
      };
    });
    wrap.querySelectorAll("[data-reject]").forEach((btn) => {
      btn.onclick = async () => {
        btn.disabled = true;
        const message = wrap.querySelector(`.review-message[data-req-id="${btn.dataset.reject}"]`).value.trim();
        const req = pending.find((r) => r.id === btn.dataset.reject);
        const { error } = await sb.from("occurrence_deletion_requests").update({ status: "rejeitada", reviewed_at: new Date().toISOString(), review_message: message || null }).eq("id", req.id);
        if (error) { showToast("Erro ao rejeitar: " + error.message); btn.disabled = false; return; }
        showToast("Solicitação rejeitada.");
        await notifyRequester(req, "rejeitada", message);
        state.pendingDeletions = await fetchPendingDeletions();
        renderList();
      };
    });
  }

  // Best-effort: the approval/rejection itself already succeeded by the
  // time this runs, so an email hiccup (bad address, SMTP blip) shouldn't
  // undo it — just tell the CCO the notification didn't go out.
  async function notifyRequester(req, status, message) {
    if (!req.requested_by) return;
    const { error } = await sb.functions.invoke("enviar-email-exclusao", {
      body: { to: req.requested_by, protocol: req.protocol, status, reason: req.reason, message },
    });
    if (error) showToast("Aviso: não foi possível enviar o e-mail ao solicitante (" + req.requested_by + ").");
  }
}

boot();

// Service workers only register on a secure context (HTTPS, or localhost) —
// this silently no-ops over plain HTTP on a LAN IP, which is fine: it just
// means no offline caching there yet, not an error worth surfacing.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
