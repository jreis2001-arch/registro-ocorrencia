<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Ocorrência</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="R.O.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root{
    --bg: #F4F6FA; --surface:#FFFFFF; --surface-alt:#F1F3F8; --border:#DDE2EC;
    --ink:#1B2434; --ink-soft:#5B6579; --ink-faint:#94A0B4;
    --primary:#1E3A5F; --primary-dark:#13253C; --primary-soft:#E6ECF5;
    --red:#C0362C; --red-soft:#FBE7E5; --amber:#B8960C; --amber-soft:#FCF3D9;
    --green:#1B7A43; --green-soft:#E3F3E9; --purple:#6B3FA0; --purple-soft:#F1E9F8;
    --map-0:#E9ECF3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Work Sans',system-ui,sans-serif;
    display:flex; justify-content:center;
  }
  h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif; margin:0;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  button{font-family:inherit; cursor:pointer;}
  textarea{font-family:inherit;}

  #shell{width:100%; max-width:480px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; box-shadow:0 0 0 1px var(--border);}
  #shell.shell-wide{max-width:1180px;}

  /* ---- painel CCO (tela 6) ---- */
  .dash-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; padding:22px 20px 0;}
  .dash-topbar-left{display:flex; align-items:center; gap:12px;}
  .dash{padding:0 20px 40px;}

  .filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:20px;}
  .filter-group{display:flex; flex-direction:column; gap:5px;}
  .filter-label{font-size:10.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  select{padding:8px 10px; border:1.5px solid var(--border); border-radius:9px; font-size:13px; font-family:inherit; background:var(--surface); color:var(--ink); min-width:120px;}
  .status-chips{display:flex; gap:6px;}
  .status-chip{display:flex; align-items:center; gap:6px; border:1.5px solid var(--border); border-radius:999px; padding:6px 10px; font-size:12px; font-weight:600; background:var(--surface);}
  .status-chip.on.EXTREMA{border-color:var(--purple); background:var(--purple-soft); color:var(--purple);}
  .status-chip.on.ALTA{border-color:var(--red); background:var(--red-soft); color:var(--red);}
  .status-chip.on.MEDIA{border-color:var(--amber); background:var(--amber-soft); color:var(--amber);}
  .status-chip.on.BAIXA{border-color:var(--green); background:var(--green-soft); color:var(--green);}
  .status-chip.on.TODOS{border-color:var(--primary); background:var(--primary-soft); color:var(--primary);}
  .status-chip.on.MULTI{border-color:var(--primary); background:linear-gradient(90deg, var(--purple-soft), var(--red-soft), var(--amber-soft), var(--green-soft)); color:var(--primary);}
  .filter-clear{margin-left:auto; font-size:12.5px; color:var(--primary); background:none; border:none; font-weight:600;}

  .dash-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:start;}
  @media (max-width:860px){ .dash-grid{grid-template-columns:1fr;} }

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px;}
  .card-title{font-size:14px; font-weight:700; margin-bottom:12px;}

  .map-wrap{position:relative;}
  #brazil-map{width:100%; height:auto; display:block;}
  #brazil-map .state{fill:var(--map-0); stroke:#FFFFFF; stroke-width:0.6; cursor:pointer; transition:opacity .12s;}
  #brazil-map .state:hover{opacity:0.75;}
  .legend{display:flex; align-items:center; gap:6px; margin-top:12px; font-size:11px; color:var(--ink-soft);}
  .legend-swatch{width:16px; height:12px; border-radius:3px;}

  .map-tooltip{
    position:fixed; pointer-events:none; background:var(--primary-dark); color:#fff; border-radius:10px;
    padding:10px 12px; font-size:12px; line-height:1.5; box-shadow:0 8px 20px -6px rgba(0,0,0,.35);
    opacity:0; transition:opacity .1s; z-index:40; min-width:150px;
  }
  .map-tooltip.show{opacity:1;}
  .tooltip-title{font-weight:700; font-size:13px; margin-bottom:4px;}
  .tooltip-row{display:flex; justify-content:space-between; gap:14px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;}
  .stat-tile{background:var(--surface-alt); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:3px;}
  .stat-num{font-family:'Space Grotesk'; font-size:20px; font-weight:700;}
  .stat-label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .stat-tile.EXTREMA .stat-num{color:var(--purple);}
  .stat-tile.ALTA .stat-num{color:var(--red);}
  .stat-tile.MEDIA .stat-num{color:var(--amber);}
  .stat-tile.BAIXA .stat-num{color:var(--green);}

  .insight-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
  .insight-tile{background:var(--surface-alt); border-radius:12px; padding:12px; display:flex; align-items:flex-start; gap:10px;}
  .insight-icon{font-size:18px; line-height:1;}
  .insight-body{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .insight-label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .insight-value{font-family:'Space Grotesk'; font-size:14px; font-weight:700; overflow-wrap:break-word;}
  .insight-trend-up{color:var(--red);}
  .insight-trend-down{color:var(--green);}
  .insight-trend-flat{color:var(--ink-soft);}
  @media (max-width:520px){ .insight-grid{grid-template-columns:1fr;} }

  .dash table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .dash thead th{text-align:left; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; padding:6px 8px; border-bottom:1px solid var(--border);}
  .dash thead th.num, .dash td.num{text-align:right; font-variant-numeric:tabular-nums;}
  .dash tbody td{padding:7px 8px; border-bottom:1px solid var(--surface-alt);}
  .dash tbody tr{cursor:pointer;}
  .dash tbody tr:hover{background:var(--surface-alt);}
  .dash tbody tr.selected{background:var(--primary-soft);}
  .table-scroll{max-height:420px; overflow-y:auto;}
  #app{flex:1; display:flex; flex-direction:column;}

  .topbar{padding:22px 20px 14px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:10px;}
  .topbar-row{display:flex; align-items:center; gap:10px;}
  .iconbtn{width:32px; height:32px; border-radius:9px; background:var(--surface-alt); border:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0;}
  .iconbtn:hover{background:var(--border);}
  .logo{width:36px; height:36px; border-radius:10px; background:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .topbar-title{font-family:'Space Grotesk'; font-size:16.5px; font-weight:700;}
  .topbar-sub{font-size:12px; color:var(--ink-soft);}
  .step-label{font-size:11.5px; color:var(--ink-soft);}

  .content{flex:1; padding:20px; display:flex; flex-direction:column; gap:16px; padding-bottom:24px;}

  .section-title{font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

  .featured{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:10px; color:#fff;}
  .featured-badge{background:rgba(255,255,255,.18); border-radius:999px; padding:5px 10px; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:5px; width:fit-content;}
  .featured-title{font-family:'Space Grotesk'; font-size:18px; font-weight:700;}
  .featured-desc{font-size:13px; opacity:.92; line-height:1.4;}
  .btn{border:none; border-radius:12px; padding:14px; font-weight:600; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-white{background:#fff; color:var(--primary-dark);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--border);}
  .btn-text{background:none; border:none; color:var(--ink-soft); font-weight:600; font-size:13px; text-align:center; padding:6px;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .cat-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 14px; display:flex; flex-direction:column; gap:8px; min-height:96px; text-align:left;}
  .cat-icon{width:34px; height:34px; border-radius:9px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .cat-label{font-size:13px; font-weight:600; line-height:1.25;}

  .occ-item{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 15px; display:flex; align-items:center; gap:12px; text-align:left; width:100%;}
  .occ-dot{width:9px; height:9px; border-radius:999px; flex-shrink:0;}
  .occ-text{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;}
  .occ-proto{font-size:13.5px; font-weight:600;}
  .occ-status{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .empty-note{font-size:13px; color:var(--ink-faint); text-align:center; padding:30px 10px;}

  .chat-wrap{flex:1; display:flex; flex-direction:column; gap:10px; padding:16px; overflow-y:auto;}
  .chat-bubble{max-width:78%; padding:9px 13px; border-radius:15px; font-size:13.5px; line-height:1.4; word-wrap:break-word;}
  .chat-bubble.mine{align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px;}
  .chat-bubble.theirs{align-self:flex-start; background:var(--surface-alt); color:var(--ink); border-bottom-left-radius:4px;}
  .chat-sender{font-size:10.5px; font-weight:700; color:var(--primary); margin-bottom:2px;}
  .chat-bubble.mine .chat-sender{color:rgba(255,255,255,.85);}
  .chat-meta{font-size:10px; opacity:.65; margin-top:3px; text-align:right;}
  .chat-input-row{display:flex; align-items:center; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--border); background:var(--surface); position:sticky; bottom:0;}
  .chat-input{flex:1; padding:11px 14px; border:1.5px solid var(--border); border-radius:999px; font-size:13.5px; font-family:inherit;}
  .chat-send{width:40px; height:40px; border-radius:999px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; border:none; flex-shrink:0;}

  .bottomnav{background:var(--surface); border-top:1px solid var(--border); display:flex; padding:9px 8px 13px; gap:4px; margin-top:auto; position:sticky; bottom:0; z-index:20;}
  .navitem{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; color:var(--ink-faint);}
  .navitem.active{color:var(--primary);}
  .navlabel{font-size:10.5px; font-weight:600;}

  /* narrativa */
  .narrative-box{position:relative;}
  textarea#narrativeInput{
    width:100%; min-height:220px; border:1.5px solid var(--border); border-radius:14px;
    padding:16px; font-size:14.5px; line-height:1.5; color:var(--ink); resize:vertical; background:var(--surface);
  }
  textarea#narrativeInput:focus{outline:none; border-color:var(--primary);}
  .mic-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .mic-btn{display:flex; align-items:center; gap:8px; border:1.5px solid var(--border); background:var(--surface); border-radius:999px; padding:9px 16px; font-size:13px; font-weight:600; color:var(--ink);}
  .mic-btn.recording{background:var(--red-soft); border-color:var(--red); color:var(--red); animation:pulse-ring 1.4s infinite;}
  .mic-icon{display:inline-flex;}
  .mic-btn.recording .mic-icon{animation:pulse-icon 1.4s infinite;}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(192,54,44,.35);} 70%{box-shadow:0 0 0 9px rgba(192,54,44,0);} 100%{box-shadow:0 0 0 0 rgba(192,54,44,0);}}
  @keyframes pulse-icon{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.35); opacity:.55;}}
  .charcount{font-size:11.5px; color:var(--ink-faint);}
  .helper{display:flex; gap:10px; background:var(--primary-soft); border-radius:12px; padding:12px 14px;}
  .helper svg{color:var(--primary); flex-shrink:0; margin-top:1px;}
  .helper-text{font-size:12px; color:var(--primary-dark); line-height:1.4;}
  .speech-warn{font-size:11.5px; color:var(--amber); background:var(--amber-soft); border-radius:10px; padding:8px 12px;}

  /* deteccao / chips */
  .detect-summary{display:flex; flex-direction:column; gap:8px;}
  .detect-chip{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .detect-chip svg.ok{color:var(--green); flex-shrink:0;}
  .detect-chip-text{flex:1; font-size:12.5px;}
  .detect-chip-label{color:var(--ink-soft);}
  .detect-chip-value{font-weight:600;}
  .detect-edit{background:none; border:none; color:var(--primary); font-size:11.5px; font-weight:600; flex-shrink:0;}

  /* perguntas */
  .crit-row{display:flex; align-items:center; gap:8px;}
  .crit-chip{display:flex; align-items:center; gap:7px; background:var(--red-soft); border-radius:999px; padding:6px 12px;}
  .crit-chip.MEDIA{background:var(--amber-soft);}
  .crit-chip.BAIXA{background:var(--green-soft);}
  .crit-chip.EXTREMA{background:var(--purple-soft);}
  .crit-dot{width:9px; height:9px; border-radius:999px; background:var(--red);}
  .crit-chip.MEDIA .crit-dot{background:var(--amber);}
  .crit-chip.BAIXA .crit-dot{background:var(--green);}
  .crit-chip.EXTREMA .crit-dot{background:var(--purple);}
  .crit-text{display:flex; flex-direction:column; line-height:1.1;}
  .crit-level{font-size:12px; font-weight:700; color:var(--red);}
  .crit-chip.MEDIA .crit-level{color:var(--amber);}
  .crit-chip.BAIXA .crit-level{color:var(--green);}
  .crit-chip.EXTREMA .crit-level{color:var(--purple);}
  .crit-sub{font-size:9px; color:var(--ink-soft);}
  .progress-track{height:5px; background:var(--surface-alt); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--primary); border-radius:999px; transition:width .25s;}

  .q-title{font-family:'Space Grotesk'; font-size:18px; font-weight:700; line-height:1.3;}
  .q-sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .options{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .option{display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:15px; text-align:left; width:100%;}
  .option.selected{border-color:var(--primary); background:var(--primary-soft);}
  .opt-dot{width:13px; height:13px; border-radius:999px; flex-shrink:0;}
  .opt-label{font-size:14px; font-weight:600; flex:1;}
  .opt-check{width:19px; height:19px; border-radius:999px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .option.selected .opt-check{border-color:var(--primary); background:var(--primary); color:#fff;}

  .chip-toggle{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--border); background:var(--surface); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink);}
  .chip-toggle.selected{border-color:var(--primary); background:var(--primary-soft); color:var(--primary-dark);}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}

  /* formulário dinâmico (dados do relator, tipologia, campos por categoria) */
  .field-group{display:flex; flex-direction:column; gap:6px;}
  .field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .field-label .req{color:var(--red);}
  .field-input, select.field-input{width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:13.5px; font-family:inherit; color:var(--ink); background:var(--surface);}
  .field-input:disabled{background:var(--surface-alt); color:var(--ink-faint);}
  .field-static{padding:12px 14px; border-radius:12px; background:var(--surface-alt); color:var(--ink-soft); font-size:13.5px;}

  /* evidencias */
  .secure{display:flex; gap:12px; background:var(--primary-soft); border-radius:14px; padding:16px;}
  .secure-icon{width:36px; height:36px; border-radius:10px; background:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff;}
  .secure-title{font-size:13px; font-weight:700; color:var(--primary-dark);}
  .secure-desc{font-size:11.5px; color:var(--primary-dark); opacity:.85; line-height:1.4; margin-top:2px;}
  .upload-area{border:1.5px dashed var(--border); border-radius:16px; padding:26px 16px; display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--surface);}
  .upload-title{font-size:13.5px; font-weight:600;}
  .upload-sub{font-size:11px; color:var(--ink-faint);}
  .file-item{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:10px 12px;}
  .file-thumb{width:40px; height:40px; border-radius:9px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0; overflow:hidden;}
  .file-thumb img{width:100%; height:100%; object-fit:cover;}
  .file-text{flex:1; min-width:0;}
  .file-name{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .file-meta{font-size:11px; color:var(--ink-soft);}
  .file-remove{width:26px; height:26px; border-radius:8px; background:var(--surface-alt); border:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); flex-shrink:0;}

  /* revisao */
  .report-box{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px;}
  textarea#reportText{width:100%; min-height:340px; border:none; padding:16px; font-size:13px; line-height:1.55; color:var(--ink); resize:vertical; font-family:'JetBrains Mono',ui-monospace,monospace;}
  textarea#reportText:focus{outline:none;}
  .edit-note{font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:6px;}

  /* confirmacao */
  .center-col{align-items:center; text-align:center;}
  .check-circle{width:70px; height:70px; border-radius:999px; background:var(--green-soft); display:flex; align-items:center; justify-content:center; color:var(--green); margin:14px auto 0;}
  .headline{font-family:'Space Grotesk'; font-size:19px; font-weight:700; margin-top:6px;}
  .subtext{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.4;}
  .proto-card{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:13px; text-align:left; margin-top:8px;}
  .proto-row{display:flex; align-items:center; justify-content:space-between;}
  .proto-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .proto-value{font-family:'Space Grotesk'; font-size:18px; font-weight:700;}
  .divider{height:1px; background:var(--border);}
  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .info-item{display:flex; flex-direction:column; gap:2px;}
  .info-label{font-size:10.5px; color:var(--ink-faint);}
  .info-value{font-size:12.5px; font-weight:600;}

  /* detalhe */
  .detail-section{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px;}
  .detail-label{font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .detail-text{font-size:13px; line-height:1.55; white-space:pre-wrap;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;}
  .toast.show{opacity:1;}

  @media (max-width:520px){ #shell{box-shadow:none;} }
</style>
</head>

function mapOccurrenceFromDb(row) {
  return {
    id: row.id,
    protocol: row.protocol,
    createdAt: row.created_at,
    store: row.store ? row.store.name : (state.store ? state.store.name : ""),
    criticality: row.criticality.toUpperCase(),
    status: STATUS_LABEL[row.status] || row.status,
    tipologia: row.tipologia,
    categoria: row.categoria,
    reportText: row.report_text,
    evidence: row.occurrence_evidence || [],
    guidanceChecked: row.guidance_checked || null,
    incidentDate: row.incident_date,
    incidentTime: row.incident_time,
  };
}

// Store accounts only ever see their own occurrences (RLS scopes it); staff
// see every store's — the join brings the store name along so the list
// makes sense when it's not implicitly "your own store".
async function fetchOccurrences() {
  const { data, error } = await sb
    .from("occurrences")
    .select("*, store:stores(name,code), occurrence_evidence(id,file_name,file_size,file_type)")
    .order("created_at", { ascending: false });
  if (error) { showToast("Erro ao carregar ocorrências: " + error.message); return []; }
  return data.map(mapOccurrenceFromDb);
}

// Stores someone claimed via autocadastro but a staff hasn't approved yet —
// staff-only (RLS lets is_staff() see every row regardless of approval).
async function fetchPendingStores() {
  const { data, error } = await sb.from("stores").select("id,name,code,type").not("auth_user_id", "is", null).eq("approved", false).order("code");
  if (error) { showToast("Erro ao carregar cadastros pendentes: " + error.message); return []; }
  return data;
}

// Staff-only: occurrence deletion requests still awaiting approval or
// rejection — a store's own pre-exclusão never deletes anything by itself.
async function fetchPendingDeletions() {
  const { data, error } = await sb.from("occurrence_deletion_requests").select("*, store:stores(name,code)").eq("status", "pendente").order("requested_at");
  if (error) { showToast("Erro ao carregar exclusões pendentes: " + error.message); return []; }
  return data;
}

function newDraft() {

    onBehalfOfStore: null, // set by screenSelecionarLoja when a staff account files on behalf of a store
    reporter: { name: "", email: "", relationship: "", role: "", phone: "" },
    tipologia: null,
    categoria: null,

    incidentTime: "",

}

/* ============================= FORMULÁRIO DINÂMICO (TIPOLOGIA_SPEC) ============================= */
function fieldsForTipologia(categoria, tipologia) {
  const cat = TIPOLOGIA_SPEC[categoria];
  if (!cat) return [];
  return cat.fields.filter((f) => f.tipologias.includes(tipologia));
}

// A condition references another field by its label text (as written in the
// spreadsheet's comment column), not by id — labels can be phrased slightly
// differently between the question and the comment referencing it, so this
// matches loosely rather than requiring an exact string match.
function findFieldByLabel(fields, labelText) {
  const norm = (s) => (s || "").toLowerCase().replace(/[?.]/g, "").trim();
  const target = norm(labelText);
  return fields.find((f) => norm(f.label) === target)
    || fields.find((f) => norm(f.label).includes(target) || target.includes(norm(f.label)));
}

function conditionMet(field, fields, answers) {
  const cond = field.condition;
  if (!cond) return true;
  const ref = findFieldByLabel(fields, cond.field);
  if (!ref) return true; // couldn't resolve the referenced field — show it rather than hide it wrongly
  const val = answers[ref.id];
  const matches = Array.isArray(val) ? val.includes(cond.value) : val === cond.value;
  return cond.op === "<>" ? !matches : matches;
}

// Best-effort criticality: the spreadsheet defines which questions to ask,
// not an official severity score, so this reads a handful of danger-signal
// fields that recur (with the same option wording) across most categories.
function computeCriticalityFromAnswers(answers) {
  let level = "BAIXA";
  const bump = (lvl) => { if (LEVELS[lvl] > LEVELS[level]) level = lvl; };
  const has = (id, val) => { const v = answers[id]; return Array.isArray(v) ? v.includes(val) : v === val; };

  if (has("houve_obito", "Sim") || has("loja_fechada", "Sim")) bump("EXTREMA");
  const integridade = answers["danos_a_integridade_fisica"];
  if (integridade) {
    if (String(integridade).startsWith("Ferimentos/Machucados graves")) bump("ALTA");
    else if (integridade !== "Sem danos físicos") bump("MEDIA");
  }
  const conflito = answers["houve_conflito"];
  if (conflito === "Agressão física") bump("ALTA");
  else if (conflito === "Agressão verbal" || conflito === "Ameaça") bump("MEDIA");
  if (has("houve_danos_estruturais", "Sim")) bump("MEDIA");
  if (has("houve_perdas", "Sim")) bump("MEDIA");
  if (has("houve_vitimas", "Sim")) bump("MEDIA");
  return level;
}

function cleanupNarrative(raw) {
  let t = (raw || "").trim().replace(/\s+/g, " ");
  if (!t) return "";
  t = t.replace(/\b(tipo|então|aí|daí|né)[,]?\s+/gi, "");
  // capitalize sentence starts
  t = t.replace(/(^\s*\w|[.!?]\s+\w)/g, (m) => m.toUpperCase());
  if (!/[.!?]$/.test(t)) t += ".";
  return t;
}

function generateReport(draft, meta) {
  const s = meta.store;
  const lines = [];
  lines.push("RELATO FORMAL DE OCORRÊNCIA");
  lines.push("");
  lines.push(`Protocolo: ${meta.protocol}`);
  lines.push(`Data/hora de registro: ${meta.dateLabel}`);
  lines.push(`Criticidade: ${LEVEL_LABEL[draft.criticality]}`);
  lines.push("");
  lines.push("DADOS DA LOJA");
  lines.push(`Loja: ${s.name}`);
  lines.push(`Formato: ${STORE_TYPE_LABELS[s.type] || s.type}`);
  lines.push(`Região: ${REGION_BY_STATE[s.state] || "—"}  |  Regional: ${s.regional || "—"}`);
  lines.push(`Estado: ${s.state || "—"}  |  Cidade: ${s.cidade || "—"}`);
  lines.push(`Endereço: ${s.endereco || "—"}`);
  lines.push(`Diretor da loja: ${s.diretor || "—"}`);
  lines.push(`Supervisor de riscos: ${s.supervisor_riscos || "—"}`);
  lines.push("");
  lines.push("DADOS DO RELATOR");
  lines.push(`Nome: ${draft.reporter.name || "—"}`);
  lines.push(`E-mail: ${draft.reporter.email || "—"}`);
  lines.push(`Relação com o Carrefour: ${draft.reporter.relationship || "—"}`);
  lines.push(`Cargo: ${draft.reporter.role || "—"}`);
  lines.push(`Telefone de contato: ${draft.reporter.phone || "—"}`);
  lines.push("");
  lines.push("DADOS DA OCORRÊNCIA");
  lines.push(`Data do fato: ${draft.incidentDate || "—"}  |  Horário aproximado: ${draft.incidentTime || "—"}`);
  lines.push(`Tipo de ocorrência: ${draft.tipologia}`);
  lines.push(`Categoria: ${draft.categoria}`);
  if (draft.answers["area_ocorrencia"]) lines.push(`Área da ocorrência: ${draft.answers["area_ocorrencia"]}`);
  const fields = fieldsForTipologia(draft.categoria, draft.tipologia);
  fields.forEach((f) => {
    const v = draft.answers[f.id];
    if (v === undefined || v === null || v === "") return;
    const display = Array.isArray(v) ? v.join(", ") : v;
    lines.push(`- ${f.label.replace(/\?$/, "")}: ${display}`);
  });
  if (draft.answers["loja_fechada"]) lines.push(`- Loja fechada/interditada por causa da ocorrência: ${draft.answers["loja_fechada"]}`);
  lines.push(`- Evidências anexadas: ${draft.evidence.length} arquivo(s)`);
  lines.push("");
  lines.push("DESCRIÇÃO (relatada pelo colaborador, revisada para formato profissional)");
  lines.push(cleanupNarrative(draft.narrativeRaw));
  return lines.join("\n");
}

function genProtocol() {
  const y = new Date().getFullYear();
  const n = Math.floor(100000 + Math.random() * 900000);
  return `RO-${y}-${n}`;
}

// Downscales an oversized photo to fit EVIDENCE_PHOTO_MAX_DIMENSION and
// re-encodes as JPEG — run only on photos that exceed EVIDENCE_MAX_PHOTO_MB,
// so a reporter never gets blocked just for using a high-megapixel camera.
function compressImage(file, maxDimension, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDimension || height > maxDimension) {
        if (width > height) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
        else { width = Math.round((width * maxDimension) / height); height = maxDimension; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        if (!blob) { reject(new Error("Falha ao compactar imagem.")); return; }
        resolve(new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Falha ao carregar imagem.")); };
    img.src = url;
  });
}

// Local calendar date (not toISOString(), which is UTC-based and can show
// "tomorrow" during the evening in Brazil's UTC-3) — used to cap "data do
// fato" so an occurrence can't be logged as happening in the future.
function todayLocalDateStr() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
}
function currentLocalTimeStr() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
}

// Escapes quotes too, not just &/</> — several call sites interpolate this
// into an HTML attribute (value="${escapeHtml(x)}"), where an un-escaped "
// in free-text input (e.g. the reporter's own name) breaks out of the
// attribute and lets a typed value inject markup or an event handler.
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    <div class="content">
      <div class="q-title">Quando aconteceu?</div>
      <div class="field-group">
        <div class="field-label">Data que a ocorrência aconteceu <span class="req">*</span></div>
        <input type="date" id="fatoData" class="field-input" value="${d.incidentDate}" max="${todayLocalDateStr()}">
      </div>
      <div class="field-group">
        <div class="field-label">Horário aproximado</div>
        <input type="time" id="fatoHora" class="field-input" value="${d.incidentTime}" ${d.incidentDate === todayLocalDateStr() ? `max="${currentLocalTimeStr()}"` : ""}>
      </div>
      <button class="btn btn-primary" id="btnContinuar">Continuar ${ICONS.arrowRight}</button>
    </div>
  `);
  document.getElementById("btnBack").onclick = () => { state.screen = "tipoOcorrencia"; render(); };
  document.getElementById("fatoData").addEventListener("input", (e) => {
    d.incidentDate = e.target.value;
    // A past date lifts the time cap; picking today re-applies it — the
    // input's own `max` can't react to another field on its own.
    document.getElementById("fatoHora").max = d.incidentDate === todayLocalDateStr() ? currentLocalTimeStr() : "";
  });
  document.getElementById("fatoHora").addEventListener("input", (e) => { d.incidentTime = e.target.value; });
  document.getElementById("btnContinuar").onclick = () => {
    if (!d.incidentDate) { showToast("Informe a data em que a ocorrência aconteceu."); return; }
    // The `max` attributes stop the native pickers, but not manual typing
    // or a pasted value — enforce both here too before the draft moves on.
    if (d.incidentDate > todayLocalDateStr()) { showToast("A data do fato não pode ser no futuro."); return; }
    if (d.incidentDate === todayLocalDateStr() && d.incidentTime && d.incidentTime > currentLocalTimeStr()) {
      showToast("O horário não pode ser no futuro para uma ocorrência de hoje.");
      return;
    }
    state.screen = "formDinamico";
    render();
  };
}

function dynFieldHtml(f, value) {
  const label = `<div class="field-label">${escapeHtml(f.label)}</div>`;
  if (f.type === "single") {
    return `<div class="field-group">${label}
      <select class="field-input dyn-input" data-id="${f.id}">
        <option value="">Selecione…</option>
        ${f.options.map((o) => `<option value="${escapeHtml(o)}" ${value === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
      </select>
    </div>`;
  }
  if (f.type === "multi") {
    const sel = Array.isArray(value) ? value : [];
    return `<div class="field-group">${label}
      <div class="chip-wrap" style="margin-top:0;" data-multi="${f.id}">
        ${f.options.map((o) => `<button type="button" class="chip-toggle ${sel.includes(o) ? "selected" : ""}" data-opt="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("")}
      </div>
    </div>`;
  }
  const inputType = f.type === "number" ? "number" : f.type === "date" ? "date" : f.type === "time" ? "time" : "text";
  return `<div class="field-group">${label}<input type="${inputType}" class="field-input dyn-input" data-id="${f.id}" value="${escapeHtml(value != null ? value : "")}"></div>`;
}

function screenFormDinamico() {
  const d = state.draft;
  const fields = fieldsForTipologia(d.categoria, d.tipologia);

  mount(`

        <button class="iconbtn" id="btnBack">${ICONS.back}</button>
        <div>

    </div>

  `);
  document.getElementById("btnBack").onclick = () => { state.screen = "dataFato"; render(); };

  renderDynForm();

  function renderDynForm() {
    // Drop answers for fields no longer applicable, so a stale value from a
    // hidden field never rides along into the submitted data.
    const visible = fields.filter((f) => conditionMet(f, fields, d.answers));
    const visibleIds = new Set(visible.map((f) => f.id));
    fields.forEach((f) => { if (!visibleIds.has(f.id)) delete d.answers[f.id]; });

    const content = document.getElementById("dynFormContent");
    content.innerHTML = visible.map((f) => dynFieldHtml(f, d.answers[f.id])).join("") + `
      <div class="field-group">
        <div class="field-label">Área da ocorrência</div>
        <select class="field-input dyn-input" data-id="area_ocorrencia">
          <option value="">Selecione…</option>
          ${AREA_OCORRENCIA_OPTIONS.map((o) => `<option value="${o}" ${d.answers["area_ocorrencia"] === o ? "selected" : ""}>${o}</option>`).join("")}
        </select>
      </div>
      <div class="field-group">
        <div class="field-label">A loja precisou ser fechada/interditada por causa desta ocorrência?</div>
        <select class="field-input dyn-input" data-id="loja_fechada">
          <option value="">Selecione…</option>
          <option value="Sim" ${d.answers["loja_fechada"] === "Sim" ? "selected" : ""}>Sim</option>
          <option value="Não" ${d.answers["loja_fechada"] === "Não" ? "selected" : ""}>Não</option>
        </select>
      </div>
      <div class="field-group">
        <div class="field-label">Descrição</div>
        <div class="narrative-box">

        </div>

          <button class="mic-btn ${isRecording ? "recording" : ""}" id="btnMic"><span class="mic-icon">${isRecording ? ICONS.micOff : ICONS.mic}</span> ${isRecording ? "Parar gravação" : "Falar em vez de digitar"}</button>
          <div class="charcount"><span id="charcount">${d.narrativeRaw.length}</span> caracteres</div>
        </div>
        ${!speechSupported() ? `<div class="speech-warn">Reconhecimento de voz não disponível neste navegador — use Chrome ou Edge, ou digite.</div>` : ``}
        <button class="btn-text" id="btnMelhorarIA" style="align-self:flex-start; margin-top:2px;">Melhorar com IA</button>
        <div id="aiSuggestionWrap"></div>
      </div>
      <button class="btn btn-primary" id="btnContinuar" style="margin-top:6px;">Continuar ${ICONS.arrowRight}</button>
    `;

    document.querySelectorAll("select.dyn-input").forEach((el) => {
      el.addEventListener("change", (e) => {
        d.answers[el.dataset.id] = e.target.value;
        if (!isRecording) renderDynForm(); // a select can gate other fields' visibility
      });
    });
    document.querySelectorAll("input.dyn-input").forEach((el) => {
      el.addEventListener("input", (e) => { d.answers[el.dataset.id] = e.target.value; });
    });
    document.querySelectorAll("[data-multi]").forEach((wrap) => {
      const id = wrap.dataset.multi;
      wrap.querySelectorAll(".chip-toggle").forEach((chip) => {
        chip.onclick = () => {
          const cur = Array.isArray(d.answers[id]) ? d.answers[id].slice() : [];
          const opt = chip.dataset.opt;
          const i = cur.indexOf(opt);
          if (i >= 0) cur.splice(i, 1); else cur.push(opt);
          d.answers[id] = cur;
          if (!isRecording) renderDynForm();
        };
      });
    });

    wireDescricao();
    document.getElementById("btnContinuar").onclick = () => {
      d.narrativeRaw = document.getElementById("descInput").value.trim();
      d.criticality = computeCriticalityFromAnswers(d.answers);
      state.screen = "evidencias";
      render();
    };
  }

  function wireDescricao() {
    const ta = document.getElementById("descInput");
    const cc = document.getElementById("charcount");
    const btnMic = document.getElementById("btnMic");
    const btnMelhorarIA = document.getElementById("btnMelhorarIA");
    const aiWrap = document.getElementById("aiSuggestionWrap");
    ta.addEventListener("input", () => {
      d.narrativeRaw = ta.value;
      cc.textContent = ta.value.length;
    });

    // Rewrites the raw narrative into clearer, professional wording via
    // Gemini (called through an Edge Function so the API key never reaches
    // the client) — but never swaps the text in without the reporter
    // confirming it still says what actually happened.
    btnMelhorarIA.onclick = async () => {
      const texto = ta.value.trim();
      if (texto.length < 5) { showToast("Escreva um pouco mais antes de pedir a melhoria."); return; }
      aiWrap.innerHTML = "";
      btnMelhorarIA.disabled = true;
      btnMelhorarIA.textContent = "Melhorando…";
      const { data, error } = await sb.functions.invoke("melhorar-relato", { body: { texto } });
      btnMelhorarIA.disabled = false;
      btnMelhorarIA.textContent = "Melhorar com IA";
      if (error || !data || data.error || !data.melhorado) {
        showToast("Não foi possível melhorar o texto agora. Tente novamente.");
        return;
      }
      aiWrap.innerHTML = `
        <div style="border:1.5px solid var(--border); border-radius:12px; padding:14px; background:var(--surface-alt); display:flex; flex-direction:column; gap:10px; margin-top:8px;">
          <div style="font-size:12.5px; font-weight:600; color:var(--ink-soft);">A IA reescreveu assim — é isso que aconteceu?</div>
          <div style="font-size:13.5px; color:var(--ink); white-space:pre-wrap;">${escapeHtml(data.melhorado)}</div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" id="btnAiConfirmar" style="flex:1;">Sim, usar este texto</button>
            <button class="btn-text" id="btnAiRecusar">Não, vou reescrever</button>
          </div>
        </div>
      `;
      document.getElementById("btnAiConfirmar").onclick = () => {
        d.narrativeRaw = data.melhorado;
        ta.value = data.melhorado;
        cc.textContent = ta.value.length;
        aiWrap.innerHTML = "";
      };
      document.getElementById("btnAiRecusar").onclick = () => {
        aiWrap.innerHTML = "";
        ta.focus();
      };
    };

    // Toggle the mic button's own DOM in place — never a full render() while
    // recording, since that would remount the textarea and orphan the live
    // transcript updates onto a detached node the user can no longer see.
    function setMicUI(recording) {
      btnMic.classList.toggle("recording", recording);
      btnMic.innerHTML = `<span class="mic-icon">${recording ? ICONS.micOff : ICONS.mic}</span> ${recording ? "Parar gravação" : "Falar em vez de digitar"}`;
    }
    btnMic.onclick = () => {
      if (isRecording) { recognition && recognition.stop(); return; }
      startDictation();
    };
    function startDictation() {
      if (!speechSupported()) { showToast("Reconhecimento de voz não é suportado neste navegador."); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = "pt-BR";
      recognition.continuous = true;
      recognition.interimResults = true;
      const base = d.narrativeRaw ? d.narrativeRaw.trim() + " " : "";
      let accumulatedFinal = "";
      recognition.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) accumulatedFinal += r[0].transcript + " ";
          else interim += r[0].transcript;
        }
        d.narrativeRaw = (base + accumulatedFinal).trim() + " ";
        ta.value = (d.narrativeRaw || "") + interim;
        cc.textContent = ta.value.length;
      };
      recognition.onerror = () => { isRecording = false; setMicUI(false); };
      recognition.onend = () => { isRecording = false; setMicUI(false); };
      recognition.start();
      isRecording = true;
      setMicUI(true);
    }
  }
}

    const files = Array.from(e.target.files);
    e.target.value = ""; // lets the same file be re-picked later if removed
    for (let f of files) {
      if (d.evidence.length >= EVIDENCE_MAX_FILES) {
        showToast(`Máximo de ${EVIDENCE_MAX_FILES} arquivos por ocorrência.`);
        break;
      }
      const isImage = f.type.startsWith("image/");
      const isVideo = f.type.startsWith("video/");
      if (isVideo && f.size > EVIDENCE_MAX_VIDEO_MB * 1024 * 1024) {
        showToast(`"${f.name}" tem ${(f.size / 1024 / 1024).toFixed(0)} MB — o limite para vídeos é ${EVIDENCE_MAX_VIDEO_MB} MB. Grave um vídeo mais curto.`);
        continue;
      }
      if (isImage && f.size > EVIDENCE_MAX_PHOTO_MB * 1024 * 1024) {
        try {
          f = await compressImage(f, EVIDENCE_PHOTO_MAX_DIMENSION, 0.8);
          if (f.size > EVIDENCE_MAX_PHOTO_MB * 1024 * 1024) {
            showToast(`"${f.name}" continua maior que ${EVIDENCE_MAX_PHOTO_MB} MB mesmo depois de compactar. Tente outra foto.`);
            continue;
          }
          showToast(`"${f.name}" foi compactada automaticamente para caber no limite.`);
        } catch (err) {
          showToast(`Não foi possível compactar "${f.name}". Tente outra foto.`);
          continue;
        }
      }
      const currentTotal = d.evidence.reduce((sum, ev) => sum + ev.size, 0);
      if (currentTotal + f.size > EVIDENCE_MAX_TOTAL_MB * 1024 * 1024) {
        showToast(`O total de evidências não pode passar de ${EVIDENCE_MAX_TOTAL_MB} MB nesta ocorrência.`);
        continue;
      }
      const url = URL.createObjectURL(f);
      d.evidence.push({ name: f.name, size: f.size, type: f.type, url, file: f });
    }
    renderFileList();
  });
  function renderFileList() {
    const list = document.getElementById("fileList");
    list.innerHTML = d.evidence.map((f, i) => `

    list.querySelectorAll(".file-remove").forEach((btn) => {
      btn.onclick = () => { d.evidence.splice(Number(btn.dataset.i), 1); renderFileList(); };
    });

  const goRevisao = () => {
    const activeStore = state.role === "staff" ? d.onBehalfOfStore : state.store;
    const meta = {
      protocol: genProtocol(), store: activeStore, operator: d.reporter.name || "Não informado",
      dateLabel: fmtDate(new Date().toISOString()), criticality: d.criticality,

    d._meta = meta;
    d.reportText = generateReport(d, meta);
    state.screen = "revisao";
    render();
  };
  document.getElementById("btnEvContinuar").onclick = goRevisao;
  document.getElementById("btnEvSkip").onclick = goRevisao;
}

// PostgREST caps a single .select() at 1000 rows — page through in batches
// so the panel's counts stay correct past that (a real risk now that the
// occurrence volume has grown well beyond it).
async function loadDashboardData() {
  const pageSize = 1000;
  let all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await sb.from("occurrences").select("criticality, created_at, store:stores(id, name, state, type)").range(from, from + pageSize - 1);
    if (error) { showToast("Erro ao carregar dados do painel: " + error.message); return; }
    all = all.concat(data);
    if (data.length < pageSize) break;
  }
  state.dashRows = all;
}

// Rows filtered by região/estado/tipo de loja AND by the selected statuses
// — the same filtered set feeds the map, the stat tiles and the table, so
// toggling Alta/Média/Baixa updates all three consistently.
function dashScopedRows() {
  const f = state.dashFilters;
  return state.dashRows.filter((r) => {
    const uf = r.store && r.store.state;
    const type = r.store && r.store.type;
    const storeId = r.store && r.store.id;
    const crit = r.criticality && r.criticality.toUpperCase();
    // "MULTI" (the 4-color map view) still wants every level in scope — it
    // only changes how the map draws the dots, not which rows count.
    if (f.statusMode !== "todos" && f.statusMode !== "MULTI" && crit !== f.statusMode) return false;
    if (f.uf !== "todos" && uf !== f.uf) return false;
    if (f.region !== "todos" && REGION_BY_STATE[uf] !== f.region) return false;
    if (f.storeType !== "todos" && type !== f.storeType) return false;
    if (f.storeId !== "todos" && storeId !== f.storeId) return false;
    return true;
  });
}

// Estado is a static region membership (doesn't depend on which occurrences
// exist), but "tipo de loja" only makes sense as options that actually have
// occurrences in that region — otherwise the filter would offer choices that
// always render an empty dashboard.
function statesForRegion(region) {
  const ufs = Object.keys(STATE_NAMES).sort();
  return region === "todos" ? ufs : ufs.filter((uf) => REGION_BY_STATE[uf] === region);
}
function storeTypesForRegion(region) {
  if (region === "todos") return Object.keys(STORE_TYPE_LABELS);
  const present = new Set();
  state.dashRows.forEach((r) => {
    const uf = r.store && r.store.state;
    const type = r.store && r.store.type;
    if (uf && type && REGION_BY_STATE[uf] === region) present.add(type);
  });
  return Object.keys(STORE_TYPE_LABELS).filter((t) => present.has(t));
}
// Same "only what actually has occurrences in scope" rule as storeTypesForRegion
// — but this one honors ALL three of the filters above it (região, estado,
// tipo de loja), not just região, since a store list that ignores estado/tipo
// once those are picked would list stores that can't actually match.
function storesForFilters(region, uf, storeType) {
  const byId = new Map();
  state.dashRows.forEach((r) => {
    const rowUf = r.store && r.store.state;
    const rowType = r.store && r.store.type;
    if (!r.store || !r.store.id) return;
    if (region !== "todos" && REGION_BY_STATE[rowUf] !== region) return;
    if (uf !== "todos" && rowUf !== uf) return;
    if (storeType !== "todos" && rowType !== storeType) return;
    if (!byId.has(r.store.id)) byId.set(r.store.id, r.store.name);
  });
  return Array.from(byId, ([id, name]) => ({ id, name })).sort((a, b) => a.name.localeCompare(b.name));
}

function dashAggregateByState(rows) {
  const byState = {};
  rows.forEach((r) => {
    const uf = r.store && r.store.state;
    const crit = r.criticality ? r.criticality.toUpperCase() : null;
    if (!uf) return;
    if (!byState[uf]) byState[uf] = { EXTREMA: 0, ALTA: 0, MEDIA: 0, BAIXA: 0, total: 0 };
    if (crit && byState[uf][crit] !== undefined) byState[uf][crit]++;
    byState[uf].total++;
  });
  return { byState };
}
function dashAggregateByStoreType(rows) {
  const byType = {};
  rows.forEach((r) => {
    const type = r.store && r.store.type;
    const crit = r.criticality ? r.criticality.toUpperCase() : null;
    if (!type) return;
    if (!byType[type]) byType[type] = { EXTREMA: 0, ALTA: 0, MEDIA: 0, BAIXA: 0, total: 0 };
    if (crit && byType[type][crit] !== undefined) byType[type][crit]++;
    byType[type].total++;
  });
  return { byType };
}

const WEEKDAY_NAMES = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

// Four quick reads on the filtered set: pace (per day/month), which weekday
// and which hour see the most occurrences, and whether the last week is up
// or down from the week before — all derived from created_at, so they
// reflect registration timing, not the (separate) incident date/time.
function dashComputeInsights(rows) {
  if (rows.length === 0) return null;
  const dates = rows.map((r) => new Date(r.created_at)).filter((d) => !isNaN(d));
  if (dates.length === 0) return null;

  const minDate = new Date(Math.min(...dates));
  const maxDate = new Date(Math.max(...dates));
  const daySpan = Math.max(1, Math.round((maxDate - minDate) / 86400000) + 1);
  const monthSpan = Math.max(1, (maxDate.getFullYear() - minDate.getFullYear()) * 12 + (maxDate.getMonth() - minDate.getMonth()) + 1);
  const avgDaily = (dates.length / daySpan).toFixed(1);
  const avgMonthly = (dates.length / monthSpan).toFixed(1);

  const byWeekday = new Array(7).fill(0);
  const byHour = new Array(24).fill(0);
  dates.forEach((d) => { byWeekday[d.getDay()]++; byHour[d.getHours()]++; });
  const maxWeekday = Math.max(...byWeekday);
  const topWeekdays = WEEKDAY_NAMES.filter((_, i) => byWeekday[i] === maxWeekday);
  const maxHour = Math.max(...byHour);
  const topHours = byHour.map((c, h) => (c === maxHour ? h : null)).filter((h) => h !== null);

  const now = new Date();
  const last7Start = new Date(now); last7Start.setDate(now.getDate() - 7);
  const prev7Start = new Date(now); prev7Start.setDate(now.getDate() - 14);
  const last7 = dates.filter((d) => d >= last7Start).length;
  const prev7 = dates.filter((d) => d >= prev7Start && d < last7Start).length;
  let trend;
  if (prev7 === 0) {
    trend = last7 > 0 ? { dir: "up", text: `Aumento (${last7} nos últimos 7 dias, nenhuma nos 7 anteriores)` } : { dir: "flat", text: "Sem ocorrências nas últimas 2 semanas" };
  } else {
    const pct = Math.round(((last7 - prev7) / prev7) * 100);
    trend = pct > 0 ? { dir: "up", text: `Aumento de ${pct}% (${last7} vs ${prev7} na semana anterior)` }
      : pct < 0 ? { dir: "down", text: `Redução de ${Math.abs(pct)}% (${last7} vs ${prev7} na semana anterior)` }
      : { dir: "flat", text: `Estável (${last7} nas duas últimas semanas)` };
  }

  return {
    avgDaily, avgMonthly,
    topWeekdaysText: `${topWeekdays.join(", ")} (${maxWeekday})`,
    topHoursText: `${topHours.map((h) => String(h).padStart(2, "0") + "h").join(", ")} (${maxHour})`,
    trend,
  };
}

// Shared by both breakdown tables so the Alta/Média/Baixa cells always read
// the same colors as the map legend and dots.
function riskCell(n, level) {
  return `<td class="num" style="color:${LEVEL_COLOR[level]}; font-weight:700;">${n}</td>`;
}

function dashRenderTable(agg) {
  const tbody = document.getElementById("stateTableBody");
  const ufs = Object.keys(agg.byState).sort((a, b) => agg.byState[b].total - agg.byState[a].total);
  tbody.innerHTML = ufs.map((uf) => {
    const s = agg.byState[uf];
    return `<tr data-uf="${uf}" class="${state.dashFilters.uf === uf ? "selected" : ""}">
      <td>${STATE_NAMES[uf]} <span class="mono" style="color:var(--ink-faint)">(${uf})</span></td>

    tr.onclick = () => {

      state.dashFilters.uf = state.dashFilters.uf === uf ? "todos" : uf;

}

function dashRenderStoreTypeTable(typeAgg) {

// A state's color is its worst criticality among the statuses currently
// selected in the filter — matching the same "pior caso" rule used to
// compute an occurrence's own criticality. Gray means no data in scope.
// Worst status present in a state, among the ones currently selected in
// the filter — same "pior caso" rule used to compute an occurrence's own
// criticality. Null means no pin: nothing in scope for that state.
const LEVEL_COLOR = { EXTREMA: "var(--purple)", ALTA: "var(--red)", MEDIA: "var(--amber)", BAIXA: "var(--green)" };

// Normally one dot per state: total count (of whatever statuses are
// selected — dashScopedRows already filtered the rows), colored by the
// worst level actually present, or by that level's own color when one
// specific level is picked. The per-level breakdown lives in the tooltip
// and table. In "MULTI" mode (the 4-color map view), returns one dot per
// level actually present in that state instead of collapsing to one.
function dashStateMarkers(agg, uf) {
  const s = agg.byState[uf];
  if (!s || s.total === 0) return [];
  if (state.dashFilters.statusMode === "MULTI") {
    return CRIT_LEVELS.filter((lvl) => s[lvl] > 0).map((lvl) => ({ color: LEVEL_COLOR[lvl], count: s[lvl] }));
  }
  // "Triscos" (todos) shows every level at once, so it gets the brand's own
  // navy rather than picking one level's color to stand for all three.
  const color = state.dashFilters.statusMode === "todos" ? "var(--primary)" : LEVEL_COLOR[state.dashFilters.statusMode];
  return [{ color, count: s.total }];
}

// A colored dot with its count written beside it.
function riskDotSvg(x, y, color, count) {
  const r = 2.1;
  return `
    <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="white" stroke-width="0.45"/>
    <text x="${x + r + 1.4}" y="${y}" dominant-baseline="central" font-size="3.6" font-weight="700" fill="#1B2434" font-family="'Space Grotesk', sans-serif">${count}</text>
  `;
}

function dashRenderMapColors(agg) {
  const svg = document.getElementById("brazil-map");
  if (!svg) return;

  Object.keys(STATE_NAMES).forEach((uf) => {
    const el = svg.querySelector(`#${uf}`);
    if (!el) return;
    const highlighted = state.dashFilters.uf === "todos" || state.dashFilters.uf === uf;
    el.style.opacity = highlighted ? "1" : "0.25";
    el.onmouseenter = (e) => dashShowTooltip(e, uf, agg);
    el.onmousemove = (e) => dashMoveTooltip(e);
    el.onmouseleave = dashHideTooltip;
    el.onclick = () => { state.dashFilters.uf = state.dashFilters.uf === uf ? "todos" : uf; render(); };
  });

  // Pins live in their own layer on top of every state, so they're never
  // occluded by a neighboring state's fill.
  let pinsLayer = svg.querySelector("#map-pins-layer");
  if (!pinsLayer) {
    pinsLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
    pinsLayer.id = "map-pins-layer";
    svg.appendChild(pinsLayer);
  }
  pinsLayer.innerHTML = Object.keys(STATE_NAMES).map((uf) => {
    const markers = dashStateMarkers(agg, uf);
    if (markers.length === 0) return "";
    const [x, y] = STATE_CENTROIDS[uf];
    const highlighted = state.dashFilters.uf === "todos" || state.dashFilters.uf === uf;
    // Multiple markers (MULTI mode) stack vertically, centered on the
    // state's usual single-dot spot, instead of overlapping in place.
    const spacing = 3.6;
    const startY = y - ((markers.length - 1) * spacing) / 2;
    const dots = markers.map((m, i) => riskDotSvg(x, startY + i * spacing, m.color, m.count)).join("");
    return `<g class="map-pin" style="cursor:pointer; opacity:${highlighted ? 1 : 0.25};" data-uf="${uf}">${dots}</g>`;
  }).join("");
  pinsLayer.querySelectorAll(".map-pin").forEach((pin) => {
    const uf = pin.dataset.uf;
    pin.addEventListener("mouseenter", (e) => dashShowTooltip(e, uf, agg));
    pin.addEventListener("mousemove", (e) => dashMoveTooltip(e));
    pin.addEventListener("mouseleave", dashHideTooltip);
    pin.addEventListener("click", () => { state.dashFilters.uf = state.dashFilters.uf === uf ? "todos" : uf; render(); });
  });
}

function dashShowTooltip(e, uf, agg) {
  const el = document.getElementById("mapTooltip");
  const s = agg.byState[uf] || { EXTREMA: 0, ALTA: 0, MEDIA: 0, BAIXA: 0, total: 0 };
  el.innerHTML = `<div class="tooltip-title">${STATE_NAMES[uf]}</div>
    <div class="tooltip-row"><span>Extremo</span><span>${s.EXTREMA}</span></div>
    <div class="tooltip-row"><span>Alta</span><span>${s.ALTA}</span></div>
    <div class="tooltip-row"><span>Média</span><span>${s.MEDIA}</span></div>
    <div class="tooltip-row"><span>Baixa</span><span>${s.BAIXA}</span></div>
    <div class="tooltip-row" style="border-top:1px solid rgba(255,255,255,.2); margin-top:4px; padding-top:4px;"><span>Total</span><span>${s.total}</span></div>`;
  el.classList.add("show");
  dashMoveTooltip(e);
}
function dashMoveTooltip(e) {
  const el = document.getElementById("mapTooltip");
  el.style.left = (e.clientX + 14) + "px";
  el.style.top = (e.clientY + 14) + "px";
}
function dashHideTooltip() { document.getElementById("mapTooltip").classList.remove("show"); }

function dashWireFilters() {
  document.querySelectorAll(".status-chip").forEach((btn) => {
    btn.onclick = () => {
      state.dashFilters.statusMode = btn.dataset.status;
      render();
    };
  });
  // Loja depends on all three filters above it, so any of them changing can
  // strand the currently picked store outside the new scope — re-validate
  // it the same way estado/tipo already do for região.
  const revalidateStore = () => {
    const f = state.dashFilters;
    if (!storesForFilters(f.region, f.uf, f.storeType).some((s) => s.id === f.storeId)) f.storeId = "todos";
  };
  document.getElementById("fRegion").onchange = (e) => {
    const region = e.target.value;
    state.dashFilters.region = region;
    if (!statesForRegion(region).includes(state.dashFilters.uf)) state.dashFilters.uf = "todos";
    if (!storeTypesForRegion(region).includes(state.dashFilters.storeType)) state.dashFilters.storeType = "todos";
    revalidateStore();
    render();
  };
  document.getElementById("fUf").onchange = (e) => { state.dashFilters.uf = e.target.value; revalidateStore(); render(); };
  document.getElementById("fType").onchange = (e) => { state.dashFilters.storeType = e.target.value; revalidateStore(); render(); };
  document.getElementById("fStore").onchange = (e) => { state.dashFilters.storeId = e.target.value; render(); };
  document.getElementById("btnClear").onclick = () => {
    state.dashFilters = { statusMode: "todos", region: "todos", uf: "todos", storeType: "todos", storeId: "todos" };
    render();
  };
}

let chatChannel = null;
let chatMessages = [];

function chatBubbleHtml(m) {
  const mine = m.sender_role === state.role;
  const time = new Date(m.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  return `<div class="chat-bubble ${mine ? "mine" : "theirs"}">
    ${!mine ? `<div class="chat-sender">${escapeHtml(m.sender_name || (m.sender_role === "staff" ? "CCO" : "Loja"))}</div>` : ""}
    <div>${escapeHtml(m.body)}</div>
    <div class="chat-meta">${time}</div>
  </div>`;
}

function renderChatMessages() {
  const wrap = document.getElementById("chatWrap");
  if (!wrap) return;
  wrap.innerHTML = chatMessages.length
    ? chatMessages.map(chatBubbleHtml).join("")
    : `<div class="empty-note">Nenhuma mensagem ainda.${state.role === "staff" ? " Envie a primeira." : ""}</div>`;
  wrap.scrollTop = wrap.scrollHeight;
}

function renderChatInput(canSend) {
  const row = document.getElementById("chatInputRow");
  if (!row) return;
  if (!canSend) {
    row.innerHTML = `<div class="empty-note" style="padding:6px 0;">Registre uma ocorrência para poder responder por aqui.</div>`;
    return;
  }
  row.innerHTML = `
    <input type="text" id="chatInput" class="chat-input" placeholder="Escrever mensagem…">
    <button class="chat-send" id="chatSend">${ICONS.send}</button>
  `;
  const input = document.getElementById("chatInput");
  const send = async () => {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.disabled = true;
    const { error } = await sb.from("messages").insert({
      store_id: state.chatStoreId,
      sender_role: state.role,
      sender_name: state.role === "staff" ? "CCO Central" : (state.store ? state.store.name : "Loja"),
      body: text,
    });
    input.disabled = false;
    input.focus();
    if (error) showToast("Erro ao enviar: " + error.message);
  };
  document.getElementById("chatSend").onclick = send;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}

function subscribeChat(storeId) {
  unsubscribeChat();
  chatChannel = sb.channel("messages-" + storeId)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `store_id=eq.${storeId}` }, (payload) => {
      chatMessages.push(payload.new);
      renderChatMessages();
    })
    .subscribe();
}

function unsubscribeChat() {
  if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
}

async function screenChat() {
  const storeId = state.chatStoreId;
  const storeName = state.chatStoreName || "";

  mount(`
    <div class="topbar">
      <div class="topbar-row">
        <button class="iconbtn" id="btnBack">${ICONS.back}</button>
        <div class="topbar-title">${escapeHtml(storeName)}</div>

    <div class="chat-input-row" id="chatInputRow"></div>
  `);

  document.getElementById("btnBack").onclick = () => {
    state.screen = state.role === "staff" ? "mensagens" : "home";
    render();
  };

  const { data, error } = await sb.from("messages").select("*").eq("store_id", storeId).order("created_at", { ascending: true });
  const wrap = document.getElementById("chatWrap");
  if (error) { wrap.innerHTML = `<div class="empty-note">Erro ao carregar: ${escapeHtml(error.message)}</div>`; return; }
  chatMessages = data || [];
  renderChatMessages();

  // Staff can always send; a store can only once it has at least one
  // occurrence on file (the RLS insert policy enforces the same rule).
  let canSend = state.role === "staff";
  if (state.role === "store") {
    const { count } = await sb.from("occurrences").select("id", { count: "exact", head: true }).eq("store_id", storeId);
    canSend = (count || 0) > 0;
  }
  renderChatInput(canSend);

  subscribeChat(storeId);

/* ============================= AUTH / BOOT ============================= */
function screenBoot() {
  mount(`<div class="content center-col" style="justify-content:center; flex:1;"><div class="q-sub">Carregando…</div></div>`);
}

// One shared login for two kinds of accounts: a store (sees screens 1-5,
// the registration flow) or staff/CCO (sees screen 6, the map dashboard).
// Which one a given login resolves to is decided here, right after auth —
// nothing in the UI lets someone choose, it's purely what the account is.
async function loadStoreAndGo() {
  const { data: staffRows } = await sb.from("staff_roles").select("role");
  if (staffRows && staffRows.length > 0) {
    state.role = "staff";
    state.occurrences = await fetchOccurrences();
    await loadDashboardData();
    state.pendingStores = await fetchPendingStores();
    state.pendingDeletions = await fetchPendingDeletions();
    state.screen = "home";
    render();
    return;
  }

  // Filtered explicitly by the caller's own id (not just left to RLS) —
  // since self-registration made unclaimed stores visible to any logged-in
  // account too, an unfiltered select() here could match many rows instead
  // of just this user's own and error out on .maybeSingle().
  const { data: storeRow, error } = await sb.from("stores").select("*").eq("auth_user_id", state.session.user.id).maybeSingle();
  if (error) {
    showToast("Erro ao carregar sua loja: " + error.message);
    await sb.auth.signOut();
    state.screen = "login";
    render();
    return;
  }
  if (!storeRow) {
    // Account exists (signed up, possibly even email-confirmed) but never
    // finished picking a store — resume registration instead of dead-ending.
    state.screen = "cadastroLoja";
    render();
    return;
  }
  if (!storeRow.approved) {
    // Claimed but not yet reviewed by staff — auth_store_id() also enforces
    // this at the RLS layer, so this isn't just a UI-level gate.
    state.store = storeRow;
    state.screen = "aguardandoAprovacao";
    render();
    return;
  }
  state.role = "store";
  state.store = storeRow;
  state.occurrences = await fetchOccurrences();
  state.screen = "home";
  render();
}

// A password-recovery link carries "type=recovery" in the URL (hash or
// query, depending on the Supabase flow) — checked directly here instead of
// waiting on the PASSWORD_RECOVERY auth event, which can arrive after
// boot() has already moved on to loadStoreAndGo() and dropped the user
// straight into the dashboard mid-typing, with no chance to set a password.
const isRecoveryLink = /type=recovery/.test(window.location.hash) || /type=recovery/.test(window.location.search);

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (isRecoveryLink) {
    state.session = session;
    state.screen = "redefinirSenha";
    render();
    return;
  }
  if (session) {
    state.session = session;
    await loadStoreAndGo();
  } else {
    state.screen = "login";
    render();
  }
}

function screenLogin() {
  mount(`
    <div class="content" style="flex:1; justify-content:center; gap:20px;">
      <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div class="logo">${ICONS.shield}</div>
        <div class="topbar-title" style="font-size:19px;">Registro de Ocorrência</div>
        <div class="q-sub">Entre com seu login</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <input type="email" id="loginEmail" placeholder="E-mail" style="padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px;">
        <input type="password" id="loginPassword" placeholder="Senha" style="padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px;">
      </div>
      <div id="turnstileWidgetLogin" style="display:flex; justify-content:center;"></div>
      <button class="btn btn-primary" id="btnLogin">Entrar</button>
      <div class="q-sub" id="loginError" style="color:var(--red); text-align:center;"></div>
      <button class="btn-text" id="btnIrCadastro" style="align-self:center;">Ainda não tem conta? Cadastre sua loja</button>
    </div>
  `);
  const emailInput = document.getElementById("loginEmail");
  const passInput = document.getElementById("loginPassword");
  const btnLogin = document.getElementById("btnLogin");
  const errEl = document.getElementById("loginError");

  // Supabase's CAPTCHA protection covers every auth endpoint, sign-in
  // included — without a token here, a correct password still gets
  // rejected server-side (as "captcha_failed"), which used to get masked
  // by the generic "wrong password" message below.
  let turnstileToken = "";
  let turnstileWidgetId = null;
  function renderTurnstile() {
    if (typeof turnstile === "undefined") { setTimeout(renderTurnstile, 300); return; }
    turnstileWidgetId = turnstile.render("#turnstileWidgetLogin", {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (token) => { turnstileToken = token; },
      "expired-callback": () => { turnstileToken = ""; },
      "error-callback": () => { turnstileToken = ""; },
    });
  }
  renderTurnstile();

  const doLogin = async () => {
    errEl.textContent = "";
    if (!turnstileToken) { errEl.textContent = "Confirme a verificação de segurança acima."; return; }
    btnLogin.disabled = true;
    btnLogin.textContent = "Entrando…";
    const { data, error } = await sb.auth.signInWithPassword({
      email: emailInput.value.trim(),
      password: passInput.value,
      options: { captchaToken: turnstileToken },
    });
    if (error) {
      // captcha_failed and other non-credential errors shouldn't be
      // reported to the user as "wrong password" — that sent at least one
      // real password-reset down a dead end chasing the wrong cause.
      errEl.textContent = error.code === "captcha_failed" || error.code === "over_request_rate_limit"
        ? "Erro de verificação: " + error.message
        : "Login ou senha incorretos.";
      btnLogin.disabled = false;
      btnLogin.textContent = "Entrar";
      if (typeof turnstile !== "undefined" && turnstileWidgetId !== null) { turnstile.reset(turnstileWidgetId); turnstileToken = ""; }
      return;
    }
    state.session = data.session;
    await loadStoreAndGo();
  };
  btnLogin.onclick = doLogin;
  passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  document.getElementById("btnIrCadastro").onclick = () => { state.screen = "cadastro"; render(); };
}

function screenCadastro() {
  mount(`
    <div class="content" style="flex:1; justify-content:center; gap:20px;">
      <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div class="logo">${ICONS.shield}</div>

        <input type="password" id="regPassword" placeholder="Senha (mínimo 8 caracteres)" style="padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px;">
        <input type="password" id="regPasswordConfirm" placeholder="Confirmar senha" style="padding:13px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px;">
      </div>
      <div id="turnstileWidget" style="display:flex; justify-content:center;"></div>
      <button class="btn btn-primary" id="btnCadastrar">Criar conta</button>
      <div class="q-sub" id="regError" style="color:var(--red); text-align:center;"></div>
      <button class="btn-text" id="btnVoltarLogin" style="align-self:center;">Já tem conta? Entrar</button>
    </div>
  `);
  const emailInput = document.getElementById("regEmail");
  const passInput = document.getElementById("regPassword");
  const passConfirmInput = document.getElementById("regPasswordConfirm");
  const btnCadastrar = document.getElementById("btnCadastrar");
  const errEl = document.getElementById("regError");
  document.getElementById("btnVoltarLogin").onclick = () => { state.screen = "login"; render(); };

  // The widget is rendered explicitly (not via Turnstile's own DOM auto-scan)
  // because mount() rebuilds this screen's HTML from scratch each visit —
  // auto-scan only fires once, on the script's initial load.
  let turnstileToken = "";
  let turnstileWidgetId = null;
  function renderTurnstile() {
    if (typeof turnstile === "undefined") { setTimeout(renderTurnstile, 300); return; }
    turnstileWidgetId = turnstile.render("#turnstileWidget", {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (token) => { turnstileToken = token; },
      "expired-callback": () => { turnstileToken = ""; },
      "error-callback": () => { turnstileToken = ""; },
    });
  }
  renderTurnstile();

  btnCadastrar.onclick = async () => {
    errEl.textContent = "";
    const email = emailInput.value.trim();
    const password = passInput.value;
    if (!email) { errEl.textContent = "Informe um e-mail."; return; }
    if (password.length < 8) { errEl.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
    if (password !== passConfirmInput.value) { errEl.textContent = "As senhas não são iguais."; return; }
    if (!turnstileToken) { errEl.textContent = "Confirme a verificação de segurança acima."; return; }
    btnCadastrar.disabled = true;
    btnCadastrar.textContent = "Criando conta…";
    const { data, error } = await sb.auth.signUp({ email, password, options: { captchaToken: turnstileToken } });
    if (error && typeof turnstile !== "undefined" && turnstileWidgetId !== null) {
      // A rejected token can't be reused — reset so the widget issues a fresh one.
      turnstile.reset(turnstileWidgetId);
      turnstileToken = "";
    }
    if (error) {
      errEl.textContent = error.message.includes("already registered") ? "Este e-mail já tem uma conta." : "Erro ao criar conta: " + error.message;
      btnCadastrar.disabled = false;
      btnCadastrar.textContent = "Criar conta";
      return;
    }
    if (!data.session) {
      showToast("Conta criada! Confirme seu e-mail e depois faça login.");
      state.screen = "login";
      render();
      return;
    }
    state.session = data.session;
    state.screen = "cadastroLoja";
    render();
  };
}

  (async () => {

    const wrap = document.getElementById("storeListWrap");
    if (error) { wrap.textContent = "Erro ao carregar lojas: " + error.message; return; }
    if (!stores || stores.length === 0) { wrap.textContent = "Todas as lojas já têm login cadastrado. Fale com o CCO."; return; }

    const renderList = (filterText) => {
      const f = (filterText || "").toLowerCase();
      const filtered = stores.filter((s) => !f || s.name.toLowerCase().includes(f) || s.code.toLowerCase().includes(f));
      wrap.className = "";
      wrap.innerHTML = filtered.length === 0 ? `<div class="empty-note">Nenhuma loja encontrada.</div>` :
        `<div style="display:flex; flex-direction:column; gap:8px;">` + filtered.slice(0, 60).map((s) => `
          <button class="occ-item" data-store-id="${s.id}">
            <div class="occ-text">

        btn.onclick = async () => {
          btn.disabled = true;
          // A store claimed by someone else a moment earlier fails the RLS
          // `using` clause silently — no error, just zero rows matched — so
          // .select() is required here to tell "claimed" apart from success.
          const { data: claimed, error: claimError } = await sb.from("stores").update({ auth_user_id: state.session.user.id }).eq("id", btn.dataset.storeId).select();
          if (claimError || !claimed || claimed.length === 0) {

            renderList(document.getElementById("storeSearch").value);
            return;
          }
          await loadStoreAndGo();
        };
      });
    };
    renderList("");
    document.getElementById("storeSearch").addEventListener("input", (e) => renderList(e.target.value));
  })();
}
